services:
  - type: web
    name: rcd-x-mini
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm run all
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BRAND_NAME
        value: RCD X MINI
      - key: HEAP_MB
        value: "1024"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
      - key: MALLOC_MMAP_THRESHOLD_
        value: "131072"
      - key: DATABASE_URL
        sync: false
      - key: MEM_LIMIT_MB
        value: "1500"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: SESSION_ENC_KEY
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false

